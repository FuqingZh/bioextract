[project]
name = "bioextract"
version = "0.1.0"
description = "Library-first extraction helpers for bioinformatics resource snapshots."
authors = [
    {name = "FuqingZh", email = "fu.qing.zhang.work@gmail.com"},
]
dependencies = [
    "polars>=1.39.3",
]
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.14",
    "pyright>=1.1.411",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
extend-select = ["SIM117"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = [".venv"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pdm]
distribution = true

[tool.pdm.scripts]
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
lint-fix = "ruff check --fix ."
typecheck = "pyright"
test = {cmd = "pytest", env = {PYTHONPATH = "src"}}
check = {composite = ["format-check", "lint", "typecheck", "test"]}
precommit = {composite = ["format", "lint-fix", "typecheck", "test"]}
