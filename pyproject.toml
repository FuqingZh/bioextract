[project]
name = "bioextract"
version = "0.1.0"
description = "Stable, provenance-aware domain access to biological database snapshots."
authors = [
    {name = "FuqingZh", email = "fu.qing.zhang.work@gmail.com"},
]
dependencies = [
    "polars>=1.39.3",
    "duckdb>=1.4.0",
]
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "numpy>=2.5.1",
    "pytest>=9.0.2",
    "ruff>=0.15.14",
    "pyright>=1.1.411",
    "tomli-w>=1.2.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "EXE",
    "RUF100",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = [".venv"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.pdm]
distribution = true

[tool.pdm.scripts]
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
lint-fix = "ruff check --fix ."
typecheck = "pyright"
test = {cmd = "pytest", env = {PYTHONPATH = "src"}}
lock-check = "pdm lock --check"
check = {composite = ["lock-check", "format-check", "lint", "typecheck", "test"]}
precommit = {composite = ["format", "lint-fix", "typecheck", "test"]}
