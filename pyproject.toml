[project]
name = "bioextract"
version = "0.1.0"
description = "Stable, provenance-aware domain access to biological database snapshots."
authors = [
    {name = "FuqingZh", email = "fu.qing.zhang.work@gmail.com"},
]
dependencies = [
    "polars>=1.39.3",
    "duckdb>=1.4.0",
    "pyarrow>=21.0.0",
]
requires-python = ">=3.13"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/FuqingZh/bioextract"
Documentation = "https://github.com/FuqingZh/bioextract/blob/main/docs/README.md"
Repository = "https://github.com/FuqingZh/bioextract"
Issues = "https://github.com/FuqingZh/bioextract/issues"
Changelog = "https://github.com/FuqingZh/bioextract/releases"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "numpy>=2.5.1",
    "pytest>=9.0.2",
    "ruff>=0.15.14",
    "pyright>=1.1.411",
    "threadpoolctl>=3.6.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "EXE",
    "RUF100",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = [
    "tests/unit",
    "tests/contract",
    "tests/integration",
]
addopts = [
    "-ra",
    "--import-mode=importlib",
]
strict = true
markers = [
    "external_snapshot: requires explicitly configured host-owned publication files",
]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = [".venv"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.pdm]
distribution = true

[tool.pdm.scripts]
format = "ruff format ."
format-check = "python scripts/run_with_thread_budget.py --default 4 -- ruff format --check ."
lint = "python scripts/run_with_thread_budget.py --default 4 -- ruff check ."
lint-fix = "ruff check --fix ."
typecheck = "python scripts/run_with_thread_budget.py --default 4 -- pyright"
test-unit = {cmd = "python scripts/run_with_thread_budget.py --default 4 -- pytest tests/unit", env = {PYTHONPATH = "src"}}
test-contract = {cmd = "python scripts/run_with_thread_budget.py --default 4 -- pytest tests/contract", env = {PYTHONPATH = "src"}}
test-integration = {cmd = "python scripts/run_with_thread_budget.py --default 4 -- pytest tests/integration", env = {PYTHONPATH = "src"}}
test-smoke = {cmd = "python scripts/run_with_thread_budget.py --default 2 -- pytest tests/smoke", env = {PYTHONPATH = "src"}}
execution-integrity = "python scripts/check_execution_integrity.py"
test = {cmd = "python scripts/run_with_thread_budget.py --default 4 -- pytest tests/unit tests/contract tests/integration", env = {PYTHONPATH = "src"}}
lock-check = "python scripts/run_with_thread_budget.py --default 4 -- pdm lock --check"
check = {composite = ["lock-check", "format-check", "lint", "execution-integrity", "typecheck", "test"]}
precommit = {composite = ["format", "lint-fix", "typecheck", "test"]}
