[project]
name = "bioextract"
version = "0.1.0"
description = "Library-first extraction helpers for bioinformatics resource snapshots."
authors = [
    {name = "FuqingZh", email = "fu.qing.zhang.work@gmail.com"},
]
dependencies = [
    "polars>=1.39.3",
]
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true


[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.14",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.pdm.scripts]
format = "ruff format ."
lint = "ruff check ."
lint-fix = "ruff check --fix ."
test = {cmd = "pytest", env = {PYTHONPATH = "src"}}
precommit = {composite = ["format", "lint-fix", "test"]}
