name: py-release-build

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing final or rc tag to build and validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: py-release-build-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PDM_IGNORE_SAVED_PYTHON: "1"
      PDM_VENV_IN_PROJECT: "1"
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install tooling
        run: python -m pip install -U pip uv pdm build twine

      - name: Verify tag-push checkout
        if: github.event_name == 'push'
        run: >-
          python scripts/verify_release_candidate.py
          --kind auto
          --tag "${RELEASE_TAG}"
          --expected-commit "${GITHUB_SHA}"

      - name: Verify manual checkout
        if: github.event_name == 'workflow_dispatch'
        run: >-
          python scripts/verify_release_candidate.py
          --kind auto
          --tag "${RELEASE_TAG}"

      - name: Sync dependencies
        run: pdm sync -G dev

      - name: Run code checks
        run: pdm run check

      - name: Build distributions
        run: pdm build

      - name: Verify distribution identity
        run: >-
          python scripts/verify_release_candidate.py
          --kind auto
          --tag "${RELEASE_TAG}"
          --dist dist

      - name: Check built artifacts
        run: python -m twine check dist/*

      - name: Verify installed wheel publication identity
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install -U pip
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python scripts/verify_installed_wheel.py

      - name: Retain build-only artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bioextract-release-build-${{ env.RELEASE_TAG }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
