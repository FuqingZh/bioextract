name: py-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  py:
    runs-on: ubuntu-latest
    env:
      PDM_IGNORE_SAVED_PYTHON: "1"
      PDM_VENV_IN_PROJECT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install tooling
        run: python -m pip install -U pip pdm build twine

      - name: Sync dependencies
        run: pdm sync -G dev --no-self

      - name: Run tests
        run: PYTHONPATH=src pdm run pytest

      - name: Build distribution
        run: pdm build

      - name: Check built artifacts
        run: python -m twine check dist/*
