name: py-publish

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: py-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PDM_IGNORE_SAVED_PYTHON: "1"
      PDM_VENV_IN_PROJECT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install tooling
        run: python -m pip install -U pip uv pdm build twine packaging

      - name: Verify tag is canonical PEP 440
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          from packaging.version import InvalidVersion, Version

          raw_tag = "${{ github.ref_name }}"
          try:
              parsed = Version(raw_tag)
          except InvalidVersion as exc:
              raise SystemExit(f"Invalid PEP 440 tag: {raw_tag!r}") from exc

          if str(parsed) != raw_tag:
              raise SystemExit(
                  f"Tag must already be canonical PEP 440, got {raw_tag!r}, canonical={str(parsed)!r}."
              )

          print(f"Tag check passed: {raw_tag}")
          PY

      - name: Sync package version from release tag
        if: github.ref_type == 'tag'
        run: python scripts/sync_release_version.py --version "${{ github.ref_name }}"

      - name: Sync dependencies
        run: pdm sync -G dev --no-self

      - name: Run tests
        run: PYTHONPATH=src pdm run pytest

      - name: Build distribution
        run: pdm build

      - name: Check built artifacts
        run: python -m twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: py-dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: py-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
