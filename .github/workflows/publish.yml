name: py-publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: py-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  final:
    if: ${{ github.event.action == 'published' && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
    env:
      PDM_IGNORE_SAVED_PYTHON: "1"
      PDM_VENV_IN_PROJECT: "1"
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install tooling
        run: python -m pip install -U pip uv pdm build twine

      - name: Sync dependencies
        run: pdm sync -G dev

      - name: Run code checks
        run: pdm run check

      - name: Build distributions
        run: pdm build

      - name: Verify final release identity
        run: >-
          python scripts/verify_release_candidate.py
          --kind final
          --tag "${RELEASE_TAG}"
          --expected-commit "${GITHUB_SHA}"
          --dist dist

      - name: Check built artifacts
        run: python -m twine check dist/*

      - name: Verify installed wheel publication identity
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install -U pip
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python scripts/verify_installed_wheel.py

      - name: Publish final release to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist

  rc:
    if: ${{ github.event.action == 'published' && github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
    env:
      PDM_IGNORE_SAVED_PYTHON: "1"
      PDM_VENV_IN_PROJECT: "1"
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install tooling
        run: python -m pip install -U pip uv pdm build twine

      - name: Sync dependencies
        run: pdm sync -G dev

      - name: Run code checks
        run: pdm run check

      - name: Build distributions
        run: pdm build

      - name: Verify release-candidate identity
        run: >-
          python scripts/verify_release_candidate.py
          --kind rc
          --tag "${RELEASE_TAG}"
          --expected-commit "${GITHUB_SHA}"
          --dist dist

      - name: Check built artifacts
        run: python -m twine check dist/*

      - name: Verify installed wheel publication identity
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install -U pip
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python scripts/verify_installed_wheel.py

      - name: Publish release candidate to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
