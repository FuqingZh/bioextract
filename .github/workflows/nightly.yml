name: py-nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: py-nightly-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PDM_IGNORE_SAVED_PYTHON: "1"
      PDM_VENV_IN_PROJECT: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install tooling
        run: python -m pip install -U pip uv pdm build twine

      - name: Sync dependencies
        run: pdm sync -G dev

      - name: Run code checks
        run: pdm run check

      - name: Build distributions
        run: pdm build

      - name: Verify distribution identity
        run: python scripts/verify_release_candidate.py --dist dist

      - name: Check built artifacts
        run: python -m twine check dist/*

      - name: Rebuild wheel from sdist
        run: >-
          python -m scripts.rebuild_wheel_from_sdist
          --dist dist
          --output build/sdist-wheel

      - name: Check rebuilt artifacts
        run: python -m twine check build/sdist-wheel/*

      - name: Verify installed wheel publication identities
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install -U pip
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python scripts/verify_installed_wheel.py
          .wheel-smoke/bin/python -m pip install --force-reinstall --no-deps build/sdist-wheel/*.whl
          .wheel-smoke/bin/python scripts/verify_installed_wheel.py

      - name: Retain finite-lived nightly artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bioextract-nightly-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
